<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeSync - Daily Habit Tracker & AI Assistance</title>
    <meta name="description" content="LifeSync adalah aplikasi Daily Habit Tracker & Assistance yang menyatukan kesehatan, waktu, keuangan, dan produktivitas dalam satu ekosistem. Kerjakan kebiasaan harian dengan bantuan AI, bahkan saat offline.">
    <meta name="theme-color" content="#00B368">
    <link rel="icon" type="image/png" href="assets/lifesync-symbol.png">

    <!-- Open Graph / Social Preview -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="LifeSync - Daily Habit Tracker & AI Assistance">
    <meta property="og:description" content="Satukan kesehatan, waktu, keuangan, dan produktivitas dalam satu aplikasi. Download App LifeSync sekarang.">
    <meta property="og:image" content="assets/lifesync-banner.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Primary Green - warna utama LifeSync (Brand Guidelines & App)
                        brand: {
                            50:  '#ECFDF5',
                            100: '#D6F5E6',
                            200: '#ADEBCE',
                            300: '#74DBAC',
                            400: '#38C585',
                            500: '#00B368',
                            600: '#009153',
                            700: '#067647',
                            800: '#075E3A',
                            900: '#064E32'
                        },
                        // Aksen per pilar kehidupan (Brand Guidelines)
                        accent: {
                            orange: '#FFA330',
                            purple: '#935EEE',
                            blue:   '#0E8DE7',
                            teal:   '#0A9073'
                        },
                        // Warna teks & permukaan aplikasi
                        ink: {
                            DEFAULT: '#1E2D27',
                            soft:    '#6B8077',
                            muted:   '#9AA8A1'
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif']
                    },
                    boxShadow: {
                        glow:   '0 18px 45px -18px rgba(0, 179, 104, 0.55)',
                        'glow-lg': '0 28px 70px -22px rgba(0, 179, 104, 0.60)',
                        card:   '0 22px 60px -30px rgba(30, 45, 39, 0.35)'
                    },
                    borderRadius: {
                        '4xl': '2rem',
                        '5xl': '2.5rem'
                    }
                }
            }
        };
    </script>
    <!-- Font: Plus Jakarta Sans (tipografi resmi LifeSync) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-white text-ink font-sans antialiased selection:bg-brand-500 selection:text-white">

    <!-- 1. HEADER / NAVBAR -->
    <div id="section-header"></div>

    <!-- 2. HERO SECTION -->
    <div id="section-hero"></div>

    <!-- 3. FITUR UTAMA -->
    <div id="section-fitur"></div>

    <!-- 4. ARSITEKTUR OFFLINE-FIRST -->
    <div id="section-offline"></div>

    <!-- 5. AI ASSISTANCE -->
    <div id="section-ai"></div>

    <!-- 6. PRICING / TIPE AKUN -->
    <div id="section-pricing"></div>

    <!-- 7. KONTAK KAMI -->
    <div id="section-kontak"></div>

    <!-- 8. FOOTER -->
    <div id="section-footer"></div>

    <!-- Script Utama -->
    <script src="app.js?v=2.0"></script>
</body>
</html>
